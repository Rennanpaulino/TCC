version: '3.8'

services:
  # --- BANCO DE DADOS COM HEALTHCHECK ---
  db:
    image: postgres:15-alpine
    container_name: tcc_postgres
    environment:
      - POSTGRES_USER=tcc_user
      - POSTGRES_PASSWORD=tcc_password
      - POSTGRES_DB=tcc_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    # O Healthcheck verifica a cada 5s se o banco responde
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcc_user -d tcc_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- SERVIÇOS PYTHON (AGORA ESPERAM O BANCO) ---
  auth_service:
    build: ./auth_service
    container_name: tcc_auth
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy  # <--- SÓ INICIA QUANDO O BANCO ESTIVER PRONTO
    environment:
      - DATABASE_URL=postgresql://tcc_user:tcc_password@db/tcc_database
    restart: always

  iot_service:
    build: ./iot_service
    container_name: tcc_iot
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://tcc_user:tcc_password@db/tcc_database
    restart: always

  report_service:
    build: ./report_service
    container_name: tcc_reports
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://tcc_user:tcc_password@db/tcc_database
    restart: always

volumes:
  postgres_data: